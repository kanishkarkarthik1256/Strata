[project]
name = "drone-recon-backend"
version = "0.1.0"
description = "AI-enabled drone video to 3D model generation system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DroneRecon Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "starlette>=0.41.0",

    # Configuration
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.1.0",

    # Database
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.21.0",

    # Logging
    "structlog>=24.4.0",

    # Image/Video processing
    "opencv-python-headless>=4.10.0",
    "Pillow>=11.0.0",

    # Numerical / Scientific
    "numpy>=1.26.0",
    "scipy>=1.14.0",

    # AI / ML
    "torch>=2.5.0",
    "torchvision>=0.20.0",

    # 3D / Geometry
    "open3d>=0.18.0",
    "trimesh>=4.5.0",
    "pygltflib>=1.16.0",

    # GPS / Geospatial
    "pyproj>=3.7.0",
    "piexif>=1.1.3",

    # Hashing / Image comparison
    "imagehash>=4.3.0",

    # File format support
    "laspy>=2.5.0",
    # LAZ is LASzip-compressed; laspy needs a decompressor to read it.
    "lazrs>=0.6.0",

    # Utilities
    "tqdm>=4.67.0",
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
drone-recon = "app.main:create_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
