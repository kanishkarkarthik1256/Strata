[package]
name = "strata-desktop"
version = "1.0.0"
description = "STRATA Desktop Shell — AI Drone Video Reconstruction Platform"
authors = ["STRATA Team"]
license = "Proprietary"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "shell-sidecar", "dialog-all", "fs-all", "path-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# default feature set
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
